services:
  pocketbase:
    build: .
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      # PocketBase's CLI has no `healthcheck` subcommand (checked with
      # --help against the real binary) — hit its /api/health endpoint
      # instead, via BusyBox's wget (bundled with the alpine base image).
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pb_data:
